[project]
name = "dendrobium-succ"
version = "0.1.0"
description = "Reproducible succinylation site prediction harness for Dendrobium officinale using RLSuccSite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "pyfaidx>=0.8",
    "modal>=0.64",
    "typer>=0.12",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24,<2",
    # Predict engine (RLSuccSite subprocess) — pinned to match bundled models
    "torch>=2.1,<2.2",
    "torchrl>=0.2,<0.3",
    "tensordict>=0.2,<0.3",
    "protlearn>=0.0.3",
    "setuptools>=68.0,<72",
]

[project.scripts]
dendrobium-succ = "dendrobium_succ.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dendrobium_succ"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project]
name = "d-officinale-succ"
version = "0.1.0"
description = "Reproducible succinylation site prediction harness for Daucus officinale using RLSuccSite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "modal>=0.64",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
d-officinale-succ = "d_officinale_succ.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d_officinale_succ"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
